name: Fetch New Khutbahs

on:
  schedule:
    - cron: '0 8 * * 5'  # Every Friday at 08:00 UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install cheerio node-fetch

      - name: Run fetcher script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-khutbahs.js

      - name: Commit and push if changed
        run: |
          git config user.name "منبر الجمعة Bot"
          git config user.email "bot@minbar-aljumua.com"
          git add khutbahs.json
          git diff --staged --quiet || git commit -m "📖 إضافة خطب جمعة جديدة - $(date +'%Y-%m-%d')"
          git push
